# ==========================================
# VERSION DU CODE : v2.9-CACHED-GRADLE920-NODE24-SCAN
# ==========================================
name: Build All Android APKs

on:
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle 9.2.0 Binaries & Dependencies
        uses: actions/cache@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-9.2.0-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-9.2.0-

      - name: Install Gradle 9.2.0 Binaries & Build All Projects with Fault Tolerance
        run: |
          # Téléchargement global de Gradle 9.2.0 s'il n'est pas présent dans le cache
          if [ ! -d "gradle-9.2.0" ]; then
            echo "Gradle 9.2.0 non trouvé localement ou dans le cache distant. Téléchargement en cours..."
            wget https://services.gradle.org/distributions/gradle-9.2.0-bin.zip
            unzip -q gradle-9.2.0-bin.zip
          else
            echo "Gradle 9.2.0 détecté via le cache."
          fi
          
          # On ajoute Gradle 9.2.0 au PATH global pour la session
          export PATH="$PWD/gradle-9.2.0/bin:$PATH"
          
          # Vérification explicite des versions actives dans le runner
          node -v
          gradle -v

          # Recherche et compilation de tous les sous-dossiers contenant un build.gradle ou build.gradle.kts
          for dir in $(find . -maxdepth 2 -name "build.gradle" -o -name "build.gradle.kts" | xargs -n1 dirname); do
            if [ "$dir" != "." ]; then
              echo "===================================================="
              echo "Compilation du projet dans : $dir"
              echo "===================================================="
              
              cd "$dir"
              
              # Contournement du fichier partagé
              mkdir -p _shared/android
              touch _shared/android/common.gradle
              
              # Compilation directe avec Gradle 9.2.0 (avec tolérance aux pannes)
              set +e
              gradle assembleDebug --no-daemon --info --debug --scan
              BUILD_STATUS=$?
              set -e

              if [ $BUILD_STATUS -ne 0 ]; then
                echo "::warning:: Le build a échoué pour le projet $dir (Code: $BUILD_STATUS). Passage au projet suivant..."
              else
                echo "Build réussi pour $dir."
              fi
              
              cd - > /dev/null
            fi
          done

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-android-apks
          path: '**/build/outputs/apk/debug/*.apk'
          
