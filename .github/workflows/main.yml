# ==========================================
# VERSION DU CODE : v2.8-CACHED-GRADLE920-NODE24-SCAN
# ==========================================
name: Build All Android APKs

on:
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle 9.2.0 Binaries & Dependencies
        uses: actions/cache@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-9.2.0-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-9.2.0-

      - name: Install Gradle 9.2.0 Binaries & Build with Scan/Debug
        run: |
          cd geniex_chat_android
          
          # Contournement du fichier partagé
          mkdir -p _shared/android
          touch _shared/android/common.gradle
          
          # Téléchargement manuel conditionnel avec le nom de version exact (9.2.0)
          if [ ! -d "gradle-9.2.0" ]; then
            echo "Gradle 9.2.0 non trouvé localement ou dans le cache distant. Téléchargement en cours..."
            wget https://services.gradle.org/distributions/gradle-9.2.0-bin.zip
            unzip -q gradle-9.2.0-bin.zip
          else
            echo "Gradle 9.2.0 détecté via le cache."
          fi
          export PATH="$PWD/gradle-9.2.0/bin:$PATH"
          
          # Vérification des versions actives
          node -v
          gradle -v
          
          # Compilation avec le wrapper et les options d'information, debug et scan
          gradle wrapper --gradle-version 9.2.0
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --info --debug --scan

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geniex-chat-apk
          path: '**/build/outputs/apk/debug/*.apk'
