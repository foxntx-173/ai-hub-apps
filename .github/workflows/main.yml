name: Build All Android Projects

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build All Android Projects with Fault Tolerance
        run: |
          # Recherche de tous les sous-dossiers contenant un fichier build.gradle ou build.gradle.kts
          for dir in $(find . -maxdepth 2 -name "build.gradle" -o -name "build.gradle.kts" | xargs -n1 dirname); do
            if [ "$dir" != "." ]; then
              echo "===================================================="
              echo "Compilation du projet dans : $dir"
              echo "===================================================="
               
              cd "$dir"
               
              # Contournement éventuel du fichier partagé si nécessaire
              mkdir -p _shared/android
              touch _shared/android/common.gradle
               
              # Génération ou mise à jour du wrapper Gradle
              gradle wrapper --gradle-version 9.2.0 || true
              chmod +x gradlew
              
              # Compilation avec tolérance aux pannes pour passer au projet suivant en cas d'échec
              set +e
              ./gradlew assembleDebug --no-daemon --info
              BUILD_STATUS=$?
              set -e

              if [ $BUILD_STATUS -ne 0 ]; then
                echo "::warning:: Le build a échoué pour le projet $dir (Code: $BUILD_STATUS). Passage au projet suivant..."
              else
                echo "Build réussi pour $dir."
              fi
               
              cd - > /dev/null
            fi
          done
